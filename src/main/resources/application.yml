spring:
  application:
    name: foody-tracking-api

  config:
    # Local values live in .env (gitignored); .env.example documents the names.
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./data/foody.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=true}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite is single-writer: more than one connection produces "database is locked".
      maximum-pool-size: 1

  jpa:
    hibernate:
      # Flyway owns the schema; 'validate' is unreliable with SQLite's loose column typing.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.community.dialect.SQLiteDialect
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  web:
    locale: pt-BR
    locale-resolver: fixed

  data:
    web:
      pageable:
        # Caps ?size= so a client cannot request an unbounded page.
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  security:
    jwt:
      # HS256 key, Base64-encoded, at least 32 bytes. Required outside the dev profile.
      secret: ${APP_SECURITY_JWT_SECRET}
      expiration-seconds: 7200
    admin:
      # Optional single bootstrap ADMIN, created once at startup. Set both or neither; blank = absent.
      email: ${APP_SECURITY_ADMIN_EMAIL:}
      password: ${APP_SECURITY_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Zone id, never a fixed offset: tzdata handles DST if it returns. Drives the Clock and the JSON dates.
  time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}

logging:
  level:
    br.com.foody.tracking: INFO
