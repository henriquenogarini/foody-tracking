spring:
  application:
    name: foody-tracking-api

  datasource:
    url: jdbc:sqlite:./data/foody.db?journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite is single-writer: more than one connection produces "database is locked".
      maximum-pool-size: 1

  jpa:
    hibernate:
      # Flyway owns the schema; 'validate' is unreliable with SQLite's loose column typing.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.community.dialect.SQLiteDialect
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
