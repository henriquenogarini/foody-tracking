# Deployment profile (the Docker image and compose.yaml activate it).
# The default profile is dev, which ships a committed JWT secret and a dev admin pair; a container
# must never fall back to it. This file adds no defaults for secrets: app.security.jwt.secret keeps
# ${APP_SECURITY_JWT_SECRET} from application.yml with no fallback, so boot fails fast without it,
# and the bootstrap admin exists only when APP_SECURITY_ADMIN_EMAIL/PASSWORD are set.

server:
  # TLS terminates at the reverse proxy: honour X-Forwarded-* so the Location header and the
  # Swagger server URL use the public scheme and host. Only in prod, which always sits behind a
  # trusted proxy; elsewhere a client could spoof these headers.
  forward-headers-strategy: framework
