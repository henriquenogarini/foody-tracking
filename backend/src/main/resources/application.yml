spring:
  application:
    name: foody-tracking-api

  config:
    # Local values live in .env (gitignored); .env.example documents the names.
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./data/foody.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=true}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite is single-writer: more than one connection produces "database is locked".
      maximum-pool-size: 1

  jpa:
    hibernate:
      # Flyway owns the schema; 'validate' is unreliable with SQLite's loose column typing.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.community.dialect.SQLiteDialect
      hibernate.jdbc.time_zone: UTC

  # Bean Validation messages in Portuguese regardless of Accept-Language.
  web:
    locale: pt-BR
    locale-resolver: fixed

  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET}
      expiration-seconds: 7200
    admin:
      email: ${APP_SECURITY_ADMIN_EMAIL:}
      password: ${APP_SECURITY_ADMIN_PASSWORD:}
    password-reset:
      enabled: ${APP_SECURITY_PASSWORD_RESET_ENABLED:true}

springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
